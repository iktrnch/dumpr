name: Test and package

on:
  workflow_call:
    inputs:
      release:
        description: Run tag-only release builds and package validation
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - if: inputs.release
        run: cargo package --list
      - if: inputs.release
        run: cargo publish --dry-run
      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint:1.7.12

  native:
    if: inputs.release
    name: Native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            cross: true
            executable: dumpr
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04
            cross: true
            executable: dumpr
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            cross: false
            executable: dumpr
          - target: aarch64-apple-darwin
            runner: macos-14
            cross: false
            executable: dumpr
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            cross: false
            executable: dumpr.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Zig cross compiler
        if: matrix.cross
        uses: mlugg/setup-zig@v2
      - name: Install cargo-zigbuild
        if: matrix.cross
        run: cargo install --locked cargo-zigbuild
      - name: Build release binary
        shell: bash
        run: |
          if [ '${{ matrix.cross }}' = true ]; then
            cargo zigbuild --release --target '${{ matrix.target }}'
          else
            cargo build --release --target '${{ matrix.target }}'
          fi
      - name: Smoke test runnable binary
        if: matrix.cross == false || matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          version="$(scripts/release-metadata.sh)"
          binary="target/${{ matrix.target }}/release/${{ matrix.executable }}"
          "$binary" --help
          test "$("$binary" --version)" = "dumpr $version"
      - name: Archive and checksum
        shell: bash
        run: |
          version="$(scripts/release-metadata.sh)"
          stage="dist/dumpr-$version-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "$stage/"
          cp README.md LICENSE.md "$stage/"
          if [ '${{ matrix.executable }}' = 'dumpr.exe' ]; then
            archive="dumpr-$version-${{ matrix.target }}.zip"
            (cd dist && 7z a "$archive" "dumpr-$version-${{ matrix.target }}")
          else
            archive="dumpr-$version-${{ matrix.target }}.tar.gz"
            tar -C dist -czf "dist/$archive" "dumpr-$version-${{ matrix.target }}"
          fi
          if command -v sha256sum >/dev/null; then
            (cd dist && sha256sum -- "$archive" > "SHA256SUMS-${{ matrix.target }}.txt")
          else
            (cd dist && shasum -a 256 "$archive" > "SHA256SUMS-${{ matrix.target }}.txt")
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS-*.txt
          if-no-files-found: error

  linux-packages:
    if: inputs.release
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-x86_64-unknown-linux-musl
          path: input
      - name: Install nFPM
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Extract exact tested binary and package it
        run: |
          tar -xzf input/dist/dumpr-*-x86_64-unknown-linux-musl.tar.gz -C input
          scripts/package-linux.sh input/dumpr-*-x86_64-unknown-linux-musl/dumpr amd64 dist
      - name: Test Debian package in clean Ubuntu
        run: |
          docker run --rm -v "$PWD/dist:/packages:ro" ubuntu:24.04 bash -ec '
            apt-get update; apt-get install -y /packages/*.deb
            test -x /usr/bin/dumpr; dumpr --help
            test "$(dumpr --version)" = "dumpr '"$(scripts/release-metadata.sh)'"'
          '
      - name: Test RPM in clean Fedora
        run: |
          docker run --rm -v "$PWD/dist:/packages:ro" fedora:latest bash -ec '
            dnf install -y /packages/*.rpm
            test -x /usr/bin/dumpr; dumpr --help
            test "$(dumpr --version)" = "dumpr '"$(scripts/release-metadata.sh)'"'
          '
      - run: (cd dist && sha256sum -- ./*.deb ./*.rpm > SHA256SUMS-linux-packages.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/

  aur-validation:
    if: inputs.release
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-x86_64-unknown-linux-musl
          path: native
      - name: Validate source and binary AUR packages in clean Arch
        run: |
          version="$(scripts/release-metadata.sh)"
          mkdir -p aur-fixtures
          git archive --format=tar.gz --prefix="dumpr-$version/" -o "aur-fixtures/dumpr-$version.tar.gz" HEAD
          tar -xzf native/dist/dumpr-*-x86_64-unknown-linux-musl.tar.gz -C aur-fixtures
          tar -C aur-fixtures -czf aur-fixtures/dumpr-bin.tar.gz "dumpr-$version-x86_64-unknown-linux-musl"
          chmod -R a+rwx aur-fixtures
          docker run --rm -v "$PWD:/work" -w /work archlinux:base-devel bash -ec '
            pacman -Syu --noconfirm --needed cargo python namcap
            useradd -m builder
            chown -R builder:builder /work/aur-fixtures
            su builder -c "cd /work && scripts/generate-aur.sh source aur-source file:///work/aur-fixtures/dumpr-'"$version"'.tar.gz $(sha256sum aur-fixtures/dumpr-'"$version"'.tar.gz | cut -d\  -f1)"
            su builder -c "cd /work/aur-source && makepkg -f --noconfirm && namcap *.pkg.tar.zst"
            pacman -U --noconfirm /work/aur-source/*.pkg.tar.zst
            dumpr --help; test "$(dumpr --version)" = "dumpr '"$version"'"
            pacman -Rns --noconfirm dumpr
            su builder -c "cd /work && scripts/generate-aur.sh bin aur-bin file:///work/aur-fixtures/dumpr-bin.tar.gz $(sha256sum aur-fixtures/dumpr-bin.tar.gz | cut -d\  -f1) x86_64"
            su builder -c "cd /work/aur-bin && makepkg -f --noconfirm && namcap *.pkg.tar.zst"
            pacman -U --noconfirm /work/aur-bin/*.pkg.tar.zst
            test -x /usr/bin/dumpr; dumpr --help; test "$(dumpr --version)" = "dumpr '"$version"'"
          '
