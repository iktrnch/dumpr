name: Test and package

on:
  workflow_call:
    inputs:
      release:
        description: Run release builds and package validation
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - if: inputs.release
        run: cargo package --list
      - if: inputs.release
        run: cargo publish --dry-run
      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint:1.7.12

  native:
    if: inputs.release
    name: Native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            cross: true
            executable: dumpr
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            cross: false
            executable: dumpr
          - target: aarch64-apple-darwin
            runner: macos-14
            cross: false
            executable: dumpr
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            cross: false
            executable: dumpr.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Zig cross compiler
        if: matrix.cross
        uses: mlugg/setup-zig@v2
      - name: Install cargo-zigbuild
        if: matrix.cross
        run: cargo install --locked cargo-zigbuild
      - name: Build release binary
        shell: bash
        run: scripts/ci/build-native.sh '${{ matrix.target }}' '${{ matrix.cross }}'
      - name: Smoke test runnable binary
        if: matrix.cross == false || matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: scripts/ci/test-native.sh '${{ matrix.target }}' '${{ matrix.executable }}'
      - name: Archive and checksum
        shell: bash
        run: scripts/ci/package-native.sh '${{ matrix.target }}' '${{ matrix.executable }}'
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS-*.txt
          if-no-files-found: error

  npm-packages:
    if: inputs.release
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm install -g npm@^11.15.0
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native
      - name: Generate and pack npm packages from tested binaries
        run: scripts/ci/package-npm.sh
      - name: Smoke test packed Linux package with both wrappers
        run: scripts/ci/test-npm.sh
      - name: Collect packed npm artifacts
        run: scripts/ci/collect-npm-artifacts.sh
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: npm-dist/*.tgz
          if-no-files-found: error

  linux-packages:
    if: inputs.release
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-x86_64-unknown-linux-musl
          path: input
      - name: Install nFPM
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Extract exact tested binary and package it
        run: scripts/ci/package-linux.sh input amd64 dist
      - name: Test Debian package in clean Ubuntu
        run: scripts/ci/test-linux-package.sh deb
      - name: Test RPM in clean Fedora
        run: scripts/ci/test-linux-package.sh rpm
      - run: (cd dist && sha256sum -- ./*.deb ./*.rpm > SHA256SUMS-linux-packages.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/

  aur-validation:
    if: inputs.release
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-x86_64-unknown-linux-musl
          path: native
      - name: Validate source and binary AUR packages in clean Arch
        run: scripts/ci/validate-aur.sh
