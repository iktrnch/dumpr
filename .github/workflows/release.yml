name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/check-release-version.sh '${{ github.ref_name }}'

  test:
    needs: validate-tag
    if: always() && (github.event_name == 'workflow_dispatch' || needs.validate-tag.result == 'success')
    uses: ./.github/workflows/test.yml
    with:
      release: true
    permissions:
      contents: read

  github-release:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release from tested artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find release-assets -type f | sort)
          test "${#assets[@]}" -gt 0
          gh release create '${{ github.ref_name }}' --generate-notes "${assets[@]}"

  crates-io:
    needs: [validate-tag, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Exchange GitHub OIDC identity for a crates.io token
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}

  npm:
    needs: [validate-tag, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm install -g npm@^11.15.0
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: npm-artifacts
      - name: Publish exact tested npm packages
        run: |
          case "$GITHUB_REF_NAME" in
            v*) version="${GITHUB_REF_NAME#v}" ;;
            *) echo "::error::Expected a v-prefixed release tag, got: $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac

          resolve_exact() {
            local filename="$1"
            mapfile -t matches < <(find npm-artifacts -type f -name "$filename" | sort)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one npm artifact named $filename; found ${#matches[@]}" >&2
              printf 'Matched artifact: %s\n' "${matches[@]}" >&2
              return 1
            fi
            resolved="${matches[0]}"
          }

          platform_filenames=(
            "iktrnch-dumpr-linux-x64-$version.tgz"
            "iktrnch-dumpr-linux-arm64-$version.tgz"
            "iktrnch-dumpr-darwin-arm64-$version.tgz"
            "iktrnch-dumpr-win32-x64-$version.tgz"
          )
          platform_packages=()
          for filename in "${platform_filenames[@]}"; do
            resolve_exact "$filename"
            platform_packages+=("$resolved")
          done

          wrapper_filename="iktrnch-dumpr-$version.tgz"
          resolve_exact "$wrapper_filename"
          wrapper_package="$resolved"

          mapfile -t all_packages < <(find npm-artifacts -type f -name '*.tgz' | sort)
          if [ "${#all_packages[@]}" -ne 5 ]; then
            echo "::error::Expected exactly five npm artifacts; found ${#all_packages[@]}" >&2
            printf 'npm artifact: %s\n' "${all_packages[@]}" >&2
            exit 1
          fi

          for package in "${platform_packages[@]}"; do
            npm publish "$package"
          done
          npm publish "$wrapper_package"

  aur:
    needs: [github-release, crates-io, npm]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: native-x86_64-unknown-linux-musl
          path: native
      - name: Configure AUR SSH key
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
      - name: Generate and push AUR package updates
        run: |
          version="$(scripts/release-metadata.sh)"
          source_url="https://github.com/iktrnch/dumpr/archive/refs/tags/v$version.tar.gz"
          source_sha="$(curl -fsSL "$source_url" | sha256sum | cut -d' ' -f1)"
          binary_url="https://github.com/iktrnch/dumpr/releases/download/v$version/dumpr-$version-x86_64-unknown-linux-musl.tar.gz"
          binary_sha="$(sha256sum native/dumpr-*-x86_64-unknown-linux-musl.tar.gz | cut -d' ' -f1)"
          for kind in source bin; do
            repo="dumpr"; [ "$kind" = bin ] && repo="dumpr-bin"
            git clone "ssh://aur@aur.archlinux.org/$repo.git" "$repo"
            if [ "$kind" = source ]; then url="$source_url"; sha="$source_sha"; else url="$binary_url"; sha="$binary_sha"; fi
            docker run --rm -v "$PWD:/work" -w /work archlinux:base-devel bash -ec "
              pacman -Syu --noconfirm --needed base-devel cargo python
              useradd -m builder; chown -R builder:builder /work/$repo
              su builder -c 'cd /work && scripts/generate-aur.sh $kind $repo $url $sha x86_64'
            "
            git -C "$repo" add PKGBUILD .SRCINFO
            git -C "$repo" -c user.name='dumpr release bot' -c user.email='release@users.noreply.github.com' commit -m "update to $version"
            git -C "$repo" push
          done
