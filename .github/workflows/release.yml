name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      ci_run_id: ${{ steps.ci_run.outputs.ci_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate release tag version
        if: github.ref_type == 'tag'
        run: scripts/ci/check-release-version.sh '${{ github.ref_name }}'
      - name: Find successful main CI run for exact commit
        id: ci_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/find-successful-ci-run.sh ci.yml main

  github-release:
    needs: prepare
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    outputs:
      ci_run_id: ${{ needs.prepare.outputs.ci_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.prepare.outputs.ci_run_id }}
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release from tested artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/create-github-release.sh '${{ github.ref_name }}' release-assets

  crates-io:
    needs: github-release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Exchange GitHub OIDC identity for a crates.io token
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}

  npm:
    needs: github-release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm install -g npm@^11.15.0
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.github-release.outputs.ci_run_id }}
          name: npm-packages
          path: npm-artifacts
      - name: Publish exact tested npm packages
        run: scripts/ci/publish-npm.sh "$GITHUB_REF_NAME" "$GITHUB_WORKSPACE/npm-artifacts"

  aur:
    needs: github-release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.github-release.outputs.ci_run_id }}
          name: native-x86_64-unknown-linux-musl
          path: native
      - name: Configure AUR SSH key
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: scripts/ci/configure-aur-ssh.sh
      - name: Generate and push AUR package updates
        run: scripts/ci/publish-aur.sh
