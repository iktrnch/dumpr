[[bin]]
name = "dumpr"
path = "src/main.rs"

[package]
name = "dumpr"
version = "1.0.2"
edition = "2024"
description = "A small command line tool that turns a directory into a readable text dump. It can print the directory tree, the contents of matching text files, or both."
license = "MIT"
repository = "https://github.com/iktrnch/dumpr"
readme = "README.md"
keywords = ["cli", "terminal", "copy-paste", "cli-tool", "ai-tools" ]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    "assets/",
    "benches/",
    "scripts/",
    ".github/",
    "packaging/",
    "skills-lock.json",
    "pyrightconfig.json",
]

[package.metadata.npm]
name = "@iktrnch/dumpr"
prefix = "@iktrnch/dumpr-"
bins = ["dumpr"]
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[profile.profiling]
inherits = "release"
debug = true
strip = false

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.54", features = ["derive"] }
ignore = "0.4.25"
unicode-width = "0.2.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2.183"

[target.'cfg(not(unix))'.dependencies]
same-file = "1.0.6"
