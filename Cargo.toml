[[bin]]
name = "dumpr"
path = "src/main.rs"

[package]
name = "dumpr"
version = "0.2.1"
edition = "2024"
description = "A small command line tool that turns a directory into a readable text dump. It can print the directory tree, the contents of matching text files, or both."
license = "MIT"
repository = "https://github.com/iktrnch/dumpr"
readme = "README.md"
keywords = ["cli", "terminal", "copy-paste", "cli-tool", "ai-tools" ]
categories = ["command-line-utilities", "development-tools"]
exclude = ["assets/"]

[profile.profiling]
inherits = "release"
debug = true
strip = false

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.54", features = ["derive"] }
ignore = "0.4.25"
regex = "1.12.3"
